name: eval

# Runs the eval set against the DEPLOYED bot.
#
# The point is where this runs. A sandbox without egress to the provider cannot
# evaluate a model, but the evaluation does not have to happen there -- pointed at
# the live URL, this exercises the whole path a visitor gets (governor, prompt
# assembly, provider, output filter, SSE framing) and needs no API key of its own,
# because the deployment already holds one.
#
# Manual only. It spends the deployment's budget, bounded by the same governor
# that bounds a visitor.

# Triggered by a commit whose message contains [eval], because a
# workflow_dispatch workflow is only registered once it reaches the repository's
# DEFAULT branch -- and this repository's default branch carries the design
# documents, not the code. A push trigger has no such requirement, so the run can
# be driven from the branch the work actually lives on.
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      target:
        description: Deployed base URL
        required: true
        default: https://cai-project-gray.vercel.app
      section:
        description: "Eval section: A, B, C, D or all"
        required: true
        default: all

jobs:
  eval:
    # Never on an ordinary push: this spends the deployment's budget.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[eval]')
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target || 'https://cai-project-gray.vercel.app' }}
      SECTION: ${{ inputs.section || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The eval runs on the same push that triggers Vercel's build, so without
      # this it would grade whatever was live when the runner started -- a prompt
      # change scored against the previous prompt, with nothing going red.
      - name: Wait for this commit to be the one serving
        run: |
          for attempt in $(seq 1 40); do
            live=$(curl -sS --max-time 10 "$TARGET/api/health" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).commit" 2>/dev/null || echo error)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "deployment is serving $live"
              exit 0
            fi
            echo "attempt $attempt: serving ${live}, waiting for ${GITHUB_SHA}"
            sleep 15
          done
          echo "::error::deployment never caught up to $GITHUB_SHA; not spending the budget grading the wrong build"
          exit 1

      - name: Health check before spending anything
        run: |
          echo "::group::/api/health"
          curl -sS "$TARGET/api/health" | tee health.json
          echo
          echo "::endgroup::"
          # A deployment serving the static tier cannot be evaluated: every answer
          # would be canned text and the run would look green for the wrong reason.
          node -e "
            const h = require('./health.json');
            if (h.tier === 'STATIC') {
              console.error('Deployment is on the STATIC tier -- there is no model to evaluate.');
              console.error('coldAuthorizeReason:', h.coldAuthorizeReason, '| ledger:', h.ledger);
              process.exit(1);
            }
            console.log('tier', h.tier, '| provider', h.provider, '| model', h.model);
          "

      - name: Run the eval set
        # Paced to stay under the deployment's per-IP rate limit, so ~8s a case.
        timeout-minutes: 20
        run: pnpm eval "$SECTION" --target "$TARGET"
        env:
          EVAL_TOKEN: ${{ secrets.EVAL_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval-results/
